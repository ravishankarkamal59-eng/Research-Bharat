<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title id="pageTitle">Research Bharat - Article</title>
<meta id="pageDescription" name="description" content="Research Bharat पर शोधपरक जानकारी पढ़ें।">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    color:#111827;
}

header{
    background:#111827;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    max-width:800px;
    margin:25px auto;
    padding:0 16px;
}

.article{
    background:white;
    padding:22px;
    border-radius:14px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.category{
    color:#2563eb;
    font-size:14px;
    font-weight:bold;
    margin-bottom:8px;
}

h1{
    font-size:28px;
    line-height:1.3;
    margin-bottom:10px;
}

.date{
    color:#6b7280;
    font-size:13px;
    margin-bottom:15px;
}

.tags{
    color:#2563eb;
    font-size:13px;
    line-height:1.7;
    margin-bottom:20px;
}

.summary{
    font-size:17px;
    font-weight:bold;
    line-height:1.6;
    margin-bottom:20px;
}

.content{
    font-size:16px;
    line-height:1.8;
    white-space:pre-line;
}

.keypoints{
    margin-top:25px;
    padding:16px;
    background:#f3f4f6;
    border-radius:10px;
}

.keypoints h2{
    font-size:19px;
    margin-bottom:10px;
}

.keypoints li{
    margin:8px 0 8px 20px;
    line-height:1.5;
}

.source{
    margin-top:25px;
    padding-top:15px;
    border-top:1px solid #e5e7eb;
    color:#6b7280;
    font-size:13px;
}

.back{
    display:inline-block;
    margin-bottom:15px;
    color:#2563eb;
    text-decoration:none;
    font-weight:bold;
}

.error{
    background:white;
    padding:25px;
    border-radius:12px;
    text-align:center;
    color:#dc2626;
}

@media(max-width:600px){
    h1{
        font-size:23px;
    }

    .article{
        padding:17px;
    }
}
</style>
</head>

<body>

<header>
    <h2>Research Bharat</h2>
    <p>Research • Current Affairs • Political Science • International Relations</p>
</header>

<div class="container">

<a href="/" class="back">← वापस Homepage</a>

<div id="article">
    Loading...
</div>

</div>

<script>

async function loadArticle(){

    const parts =
        window.location.pathname.split("/").filter(Boolean);

    const id =
        parts.length > 1 && parts[0] === "article"
        ? parts[1]
        : new URLSearchParams(window.location.search).get("id");

    const box =
        document.getElementById("article");

    if(!id){

        box.innerHTML =
            '<div class="error">Article ID नहीं मिला।</div>';

        return;
    }

    try{

        const response =
            await fetch("https://research-bharat-backend.onrender.com/api/articles/" + id);

        const data =
            await response.json();

        if(!data.success){

            box.innerHTML =
                '<div class="error">Article नहीं मिला।</div>';

            return;
        }

        const article =
            data.article;

        document.title =
            article.title + " - Research Bharat";

        const metaDescription =
            document.getElementById("pageDescription");

        if (metaDescription) {
            metaDescription.setAttribute(
                "content",
                article.summary ||
                "Research Bharat पर शोधपरक जानकारी पढ़ें।"
            );
        }

        const tags =
            article.tags && article.tags.length
            ? "🏷️ " + article.tags.join(" • ")
            : "";

        let keyPoints = "";

        if(
            article.keyPoints &&
            article.keyPoints.length
        ){

            keyPoints = `
                <div class="keypoints">
                    <h2>मुख्य बिंदु</h2>
                    <ul>
                        ${article.keyPoints.map(point =>
                            `<li>${escapeHTML(point)}</li>`
                        ).join("")}
                    </ul>
                </div>
            `;
        }

        box.innerHTML = `
            <article class="article">

                <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;">
                    <button onclick="shareArticle()" style="border:0;padding:10px 14px;border-radius:8px;background:#2563eb;color:white;font-weight:bold;cursor:pointer;">
                        📤 Share
                    </button>

                    <button onclick="copyArticleLink()" style="border:0;padding:10px 14px;border-radius:8px;background:#111827;color:white;font-weight:bold;cursor:pointer;">
                        🔗 Copy Link
                    </button>
                </div>

                <div class="category">
                    ${escapeHTML(article.category || "")}
                </div>

                <h1>
                    ${escapeHTML(article.title || "")}
                </h1>

                <div class="date">
                    ${article.date ? "📅 " + escapeHTML(article.date) : ""}
                </div>

                <div class="tags">
                    ${escapeHTML(tags)}
                </div>

                <div class="summary">
                    ${escapeHTML(article.summary || "")}
                </div>

                <div class="content">
                    ${escapeHTML(article.content || "")}
                </div>

                ${keyPoints}

                <div class="source">
                    Source: ${escapeHTML(article.source || "Research Bharat")}
                </div>

            </article>
        `;

    }catch(error){

        console.error(error);

        box.innerHTML =
            '<div class="error">Article load नहीं हो पाया।</div>';
    }
}

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

async function copyArticleLink(){

    try{

        await navigator.clipboard.writeText(
            window.location.href
        );

        alert("Article link copy हो गया ✅");

    }catch(error){

        alert("Link copy नहीं हो पाया");
    }
}


async function shareArticle(){

    const shareData = {
        title: document.title,
        text: "Research Bharat पर यह research article पढ़ें",
        url: window.location.href
    };

    try{

        if(navigator.share){

            await navigator.share(shareData);

        }else{

            await copyArticleLink();
        }

    }catch(error){

        console.log("Share cancelled");
    }
}


loadArticle();

</script>

</body>
</html>
